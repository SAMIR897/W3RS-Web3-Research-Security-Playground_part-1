<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>W3RS: Web3 Research & Security Playground</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Rajdhani:wght@600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: #03060c;
            overflow: hidden;
            font-family: 'Rajdhani', sans-serif;
            color: #e2e8f0;
        }

        #viewport {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at 65% 25%, #0d1527 0%, #050811 55%, #020307 100%);
        }

        /* SVG Viewport Container */
        .scene-container {
            width: 100%;
            height: 100%;
            max-width: 100vw;
            max-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        svg.main-scene {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: contain;
        }

        /* Ambient CRT scanline and vignette overlay */
        .crt-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%),
                        radial-gradient(circle at center, transparent 65%, rgba(0, 0, 0, 0.75) 100%);
            background-size: 100% 4px, 100% 100%;
            z-index: 10;
            opacity: 0.85;
        }

        /* Interactive Menu Items inside SVG */
        .menu-btn {
            cursor: pointer;
            transition: transform 0.15s ease-out;
        }

        .menu-btn:hover {
            transform: translateX(6px);
        }

        .menu-btn.active {
            transform: translateX(8px);
        }

        .menu-btn text {
            font-family: 'Cinzel', serif;
            font-weight: 700;
            letter-spacing: 2px;
            font-size: 21px;
            fill: #94a3b8;
            transition: fill 0.2s, filter 0.2s;
        }

        .menu-btn:hover text,
        .menu-btn.active text {
            fill: #ffdf79;
            filter: drop-shadow(0 0 8px rgba(251, 191, 36, 0.8));
        }

        .menu-btn .btn-bg {
            fill: url(#btn-gradient-normal);
            stroke: #2e384d;
            stroke-width: 1.5;
            transition: all 0.2s ease;
        }

        .menu-btn:hover .btn-bg,
        .menu-btn.active .btn-bg {
            fill: url(#btn-gradient-active);
            stroke: #f59e0b;
            stroke-width: 2;
            filter: drop-shadow(0 0 12px rgba(245, 158, 11, 0.65));
        }

        .menu-btn .btn-arrow {
            opacity: 0;
            fill: #f59e0b;
            transition: opacity 0.2s ease, transform 0.2s ease;
            filter: drop-shadow(0 0 6px #f59e0b);
        }

        .menu-btn:hover .btn-arrow,
        .menu-btn.active .btn-arrow {
            opacity: 1;
            transform: translateX(3px);
        }

        .menu-btn .corner-bracket {
            fill: none;
            stroke: #475569;
            stroke-width: 1.5;
            transition: stroke 0.2s;
        }

        .menu-btn:hover .corner-bracket,
        .menu-btn.active .corner-bracket {
            stroke: #fbbf24;
            filter: drop-shadow(0 0 4px #f59e0b);
        }

        /* Torch Flame Keyframes */
        @keyframes flameWiggle {
            0%, 100% { transform: scale(1) skewX(0deg); opacity: 0.95; }
            25% { transform: scale(1.04, 0.96) skewX(-1.5deg); opacity: 0.85; }
            50% { transform: scale(0.97, 1.05) skewX(1deg); opacity: 1; }
            75% { transform: scale(1.02, 0.98) skewX(-0.5deg); opacity: 0.9; }
        }

        .animated-flame {
            transform-origin: center bottom;
            animation: flameWiggle 1.8s infinite ease-in-out;
        }

        .flame-left { animation-delay: 0s; }
        .flame-right { animation-delay: 0.6s; }

        @keyframes emberRise {
            0% { transform: translateY(0) translateX(0); opacity: 1; }
            50% { transform: translateY(-40px) translateX(10px); opacity: 0.7; }
            100% { transform: translateY(-90px) translateX(-5px); opacity: 0; }
        }

        .ember {
            animation: emberRise 3s infinite linear;
        }
        .ember-1 { animation-delay: 0.2s; }
        .ember-2 { animation-delay: 1.1s; }
        .ember-3 { animation-delay: 2.0s; }

        /* Floating Audio Control Pill */
        .audio-pill {
            position: absolute;
            top: 20px;
            right: 25px;
            z-index: 20;
            background: rgba(15, 23, 42, 0.75);
            border: 1px solid #334155;
            color: #cbd5e1;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-family: 'Share Tech Mono', monospace;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            backdrop-filter: blur(8px);
            transition: all 0.2s;
        }

        .audio-pill:hover {
            border-color: #f59e0b;
            color: #fbbf24;
            box-shadow: 0 0 10px rgba(245, 158, 11, 0.3);
        }

        /* Modal Overlays for New Operation, Settings, etc. */
        .modal-backdrop {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(2, 6, 17, 0.85);
            backdrop-filter: blur(10px);
            z-index: 50;
            display: none;
            align-items: center;
            justify-content: center;
        }

        .modal-backdrop.open {
            display: flex;
        }

        .modal-window {
            background: linear-gradient(135deg, #0f172a 0%, #090d16 100%);
            border: 2px solid #b45309;
            box-shadow: 0 0 35px rgba(245, 158, 11, 0.3), inset 0 0 20px rgba(0, 0, 0, 0.8);
            border-radius: 8px;
            width: 90%;
            max-width: 720px;
            padding: 30px;
            position: relative;
        }

        .modal-title {
            font-family: 'Cinzel', serif;
            font-size: 26px;
            font-weight: 800;
            color: #f59e0b;
            letter-spacing: 2px;
            margin-bottom: 20px;
            border-bottom: 1px solid #334155;
            padding-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-close {
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 24px;
            cursor: pointer;
            transition: color 0.2s;
        }

        .modal-close:hover {
            color: #ef4444;
        }

        .mission-card {
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid #334155;
            border-radius: 6px;
            padding: 16px;
            margin-bottom: 12px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s;
        }

        .mission-card:hover {
            border-color: #f59e0b;
            background: rgba(45, 55, 72, 0.8);
            transform: translateX(4px);
        }

        .mission-badge {
            font-family: 'Share Tech Mono', monospace;
            font-size: 11px;
            padding: 4px 8px;
            border-radius: 4px;
            text-transform: uppercase;
        }

        .badge-evm { background: #1e3a8a; color: #93c5fd; }
        .badge-sol { background: #581c87; color: #d8b4fe; }
        .badge-bridge { background: #831843; color: #fbcfe8; }

        .btn-launch {
            background: linear-gradient(180deg, #d97706 0%, #b45309 100%);
            color: #fff;
            border: 1px solid #fbbf24;
            padding: 10px 24px;
            font-family: 'Cinzel', serif;
            font-weight: 700;
            letter-spacing: 1px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 15px;
            display: block;
            text-align: center;
            text-decoration: none;
        }

        .btn-launch:hover {
            background: linear-gradient(180deg, #f59e0b 0%, #d97706 100%);
            box-shadow: 0 0 15px rgba(245, 158, 11, 0.6);
        }
    </style>
</head>
<body>
    <div id="viewport">
        <!-- Ambient CRT Scanline Overlay -->
        <div class="crt-overlay"></div>

        <!-- Optional Audio Toggle -->
        <div class="audio-pill" id="audioToggle">
            <span id="audioIcon">🔊</span>
            <span id="audioText">AUDIO: ACTIVE</span>
        </div>

        <!-- Main Vector SVG Scene -->
        <div class="scene-container">
            <svg class="main-scene" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <!-- Moonlight & Sky Gradients -->
                    <radialGradient id="sky-moon-glow" cx="66%" cy="17%" r="45%">
                        <stop offset="0%" stop-color="#bfdbfe" stop-opacity="0.9" />
                        <stop offset="15%" stop-color="#3b82f6" stop-opacity="0.35" />
                        <stop offset="45%" stop-color="#1e293b" stop-opacity="0.15" />
                        <stop offset="100%" stop-color="#050814" stop-opacity="0" />
                    </radialGradient>

                    <radialGradient id="moon-surface" cx="45%" cy="40%" r="50%">
                        <stop offset="0%" stop-color="#ffffff" />
                        <stop offset="70%" stop-color="#e0e7ff" />
                        <stop offset="100%" stop-color="#93c5fd" />
                    </radialGradient>

                    <!-- Torch Glow Gradients -->
                    <radialGradient id="torch-glow-left" cx="445" cy="460" r="280" gradientUnits="userSpaceOnUse">
                        <stop offset="0%" stop-color="#ff7a00" stop-opacity="0.75" />
                        <stop offset="35%" stop-color="#ea580c" stop-opacity="0.35" />
                        <stop offset="75%" stop-color="#7c2d12" stop-opacity="0.1" />
                        <stop offset="100%" stop-color="#020307" stop-opacity="0" />
                    </radialGradient>

                    <radialGradient id="torch-glow-right" cx="905" cy="485" r="280" gradientUnits="userSpaceOnUse">
                        <stop offset="0%" stop-color="#ff7a00" stop-opacity="0.75" />
                        <stop offset="35%" stop-color="#ea580c" stop-opacity="0.35" />
                        <stop offset="75%" stop-color="#7c2d12" stop-opacity="0.1" />
                        <stop offset="100%" stop-color="#020307" stop-opacity="0" />
                    </radialGradient>

                    <!-- Metallic Chiseled Letter Gradients -->
                    <linearGradient id="metal-bevel-top" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#ffffff" />
                        <stop offset="30%" stop-color="#cbd5e1" />
                        <stop offset="70%" stop-color="#64748b" />
                        <stop offset="100%" stop-color="#1e293b" />
                    </linearGradient>

                    <linearGradient id="metal-bevel-dark" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stop-color="#334155" />
                        <stop offset="60%" stop-color="#1e293b" />
                        <stop offset="100%" stop-color="#0f172a" />
                    </linearGradient>

                    <!-- Crimson Slash Gradients -->
                    <linearGradient id="crimson-slash-grad" x1="0%" y1="0%" x2="100%" y2="50%">
                        <stop offset="0%" stop-color="#7f1d1d" />
                        <stop offset="25%" stop-color="#b91c1c" />
                        <stop offset="55%" stop-color="#ef4444" />
                        <stop offset="85%" stop-color="#991b1b" />
                        <stop offset="100%" stop-color="#450a0a" />
                    </linearGradient>

                    <!-- Menu Button States -->
                    <linearGradient id="btn-gradient-normal" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="#141822" />
                        <stop offset="50%" stop-color="#1b212f" />
                        <stop offset="100%" stop-color="#10141c" />
                    </linearGradient>

                    <linearGradient id="btn-gradient-active" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="#3d2105" />
                        <stop offset="30%" stop-color="#24190c" />
                        <stop offset="70%" stop-color="#1f1a14" />
                        <stop offset="100%" stop-color="#2f1c07" />
                    </linearGradient>

                    <!-- Glow Filters -->
                    <filter id="amber-glow-filter" x="-20%" y="-20%" width="140%" height="140%">
                        <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur" />
                        <feMerge>
                            <feMergeNode in="blur" />
                            <feMergeNode in="SourceGraphic" />
                        </feMerge>
                    </filter>

                    <filter id="moon-halo-filter">
                        <feGaussianBlur in="SourceGraphic" stdDeviation="18" />
                    </filter>
                </defs>

                <!-- ========================================== -->
                <!-- 1. BACKGROUND ENVIRONMENT (GOTHIC RUINS)  -->
                <!-- ========================================== -->

                <!-- Deep Twilight Sky -->
                <rect x="0" y="0" width="1920" height="1080" fill="#04060d" />
                <rect x="1150" y="40" width="450" height="600" fill="url(#sky-moon-glow)" />

                <!-- Night Sky Stars through the Window -->
                <g fill="#ffffff" opacity="0.8">
                    <circle cx="1220" cy="90" r="1.5" />
                    <circle cx="1380" cy="70" r="2" />
                    <circle cx="1450" cy="130" r="1.2" />
                    <circle cx="1260" cy="160" r="1" />
                    <circle cx="1520" cy="95" r="1.8" />
                    <circle cx="1190" cy="220" r="1.2" />
                    <circle cx="1340" cy="240" r="1.5" />
                </g>

                <!-- Distant Moon -->
                <circle cx="1310" cy="135" r="72" fill="#bfdbfe" opacity="0.3" filter="url(#moon-halo-filter)" />
                <circle cx="1310" cy="135" r="62" fill="url(#moon-surface)" />
                <!-- Moon Crater Texture Detailing -->
                <ellipse cx="1295" cy="120" rx="14" ry="12" fill="#93c5fd" opacity="0.45" />
                <ellipse cx="1335" cy="145" rx="10" ry="16" fill="#93c5fd" opacity="0.4" />
                <ellipse cx="1315" cy="165" rx="18" ry="9" fill="#93c5fd" opacity="0.35" />

                <!-- Distant Silhouetted Fortress & Towers Beyond Arch -->
                <path d="M 1190,440 L 1190,260 L 1220,260 L 1220,275 L 1235,275 L 1235,260 L 1250,260 L 1250,290 L 1290,290 L 1290,210 L 1315,210 L 1315,230 L 1335,230 L 1335,210 L 1360,210 L 1360,320 L 1420,320 L 1420,440 Z" fill="#0d1424" opacity="0.9" />

                <!-- Grand Gothic Arched Window Architecture -->
                <!-- Outer Wall Shadow -->
                <path d="M 0,0 L 1920,0 L 1920,1080 L 0,1080 Z M 1150,560 L 1150,290 Q 1310,40 1470,290 L 1470,560 Z" fill="#060912" fill-rule="evenodd" />

                <!-- Stone Arch Mouldings -->
                <path d="M 1135,570 L 1135,285 Q 1310,25 1485,285 L 1485,570 L 1465,570 L 1465,290 Q 1310,50 1155,290 L 1155,570 Z" fill="#1b2333" stroke="#2c3b54" stroke-width="2" />
                
                <!-- Gothic Balustrade / Arch Railing -->
                <path d="M 1150,480 L 1470,480 L 1470,540 L 1150,540 Z" fill="#0b101c" stroke="#1e293b" />
                <g fill="#162030">
                    <rect x="1175" y="490" width="18" height="40" rx="3" />
                    <rect x="1225" y="490" width="18" height="40" rx="3" />
                    <rect x="1275" y="490" width="18" height="40" rx="3" />
                    <rect x="1325" y="490" width="18" height="40" rx="3" />
                    <rect x="1375" y="490" width="18" height="40" rx="3" />
                    <rect x="1425" y="490" width="18" height="40" rx="3" />
                </g>

                <!-- Vaulted Stone Ceilings & Massive Columns -->
                <!-- Left Stone Pillar Block -->
                <path d="M 390,0 L 460,0 L 470,720 L 380,720 Z" fill="#090d16" stroke="#161f30" stroke-width="2" />
                <path d="M 460,0 L 510,0 L 520,720 L 470,720 Z" fill="#0d1422" />

                <!-- Center Right Grand Pillar with Arch Spring -->
                <path d="M 870,0 L 960,0 L 980,700 L 850,700 Z" fill="#080c14" stroke="#161f30" stroke-width="2" />
                <path d="M 960,0 L 1020,0 L 1030,700 L 980,700 Z" fill="#0d131f" />

                <!-- Far Right Wall & Arch Column -->
                <path d="M 1520,0 L 1640,0 L 1650,700 L 1500,700 Z" fill="#080c14" />
                <path d="M 1640,0 L 1760,0 L 1770,700 L 1650,700 Z" fill="#0f1624" stroke="#1c283d" />

                <!-- ========================================== -->
                <!-- 2. CRIMSON FACTION BANNERS                 -->
                <!-- ========================================== -->

                <!-- Left Banner -->
                <g id="banner-left">
                    <!-- Iron Hanging Bracket -->
                    <rect x="525" y="65" width="110" height="10" fill="#334155" />
                    <circle cx="530" cy="70" r="8" fill="#1e293b" stroke="#475569" stroke-width="2" />
                    <circle cx="630" cy="70" r="8" fill="#1e293b" stroke="#475569" stroke-width="2" />
                    <!-- Red Cloth Body with notched pennant ends -->
                    <path d="M 535,75 L 625,75 L 625,370 L 580,410 L 535,370 Z" fill="#881313" stroke="#991b1b" stroke-width="2" />
                    <path d="M 545,75 L 615,75 L 615,355 L 580,390 L 545,355 Z" fill="#991b1b" />
                    <!-- Gold Trim -->
                    <path d="M 548,85 L 612,85 L 612,350 L 580,380 L 548,350 Z" fill="none" stroke="#d97706" stroke-width="2" />
                    <!-- Stylized Wolf / Cyber Commando Crest on Banner -->
                    <g transform="translate(580, 200) scale(0.65)">
                        <polygon points="0,-45 28,-10 38,30 20,45 0,35 -20,45 -38,30 -28,-10" fill="#180505" stroke="#fbbf24" stroke-width="3" />
                        <!-- Wolf Ears & Eyes -->
                        <polygon points="-24,-40 -12,-15 -28,-12" fill="#fbbf24" />
                        <polygon points="24,-40 12,-15 28,-12" fill="#fbbf24" />
                        <polygon points="-16,0 -4,5 -14,10" fill="#ef4444" />
                        <polygon points="16,0 4,5 14,10" fill="#ef4444" />
                    </g>
                </g>

                <!-- Right Banner -->
                <g id="banner-right">
                    <rect x="1560" y="65" width="105" height="10" fill="#334155" />
                    <circle cx="1565" cy="70" r="8" fill="#1e293b" stroke="#475569" stroke-width="2" />
                    <circle cx="1660" cy="70" r="8" fill="#1e293b" stroke="#475569" stroke-width="2" />
                    <path d="M 1570,75 L 1655,75 L 1655,370 L 1612,410 L 1570,370 Z" fill="#881313" stroke="#991b1b" stroke-width="2" />
                    <path d="M 1580,75 L 1645,75 L 1645,355 L 1612,390 L 1580,355 Z" fill="#991b1b" />
                    <path d="M 1583,85 L 1642,85 L 1642,350 L 1612,380 L 1583,350 Z" fill="none" stroke="#d97706" stroke-width="2" />
                    <g transform="translate(1612, 200) scale(0.65)">
                        <polygon points="0,-45 28,-10 38,30 20,45 0,35 -20,45 -38,30 -28,-10" fill="#180505" stroke="#fbbf24" stroke-width="3" />
                        <polygon points="-24,-40 -12,-15 -28,-12" fill="#fbbf24" />
                        <polygon points="24,-40 12,-15 28,-12" fill="#fbbf24" />
                        <polygon points="-16,0 -4,5 -14,10" fill="#ef4444" />
                        <polygon points="16,0 4,5 14,10" fill="#ef4444" />
                    </g>
                </g>

                <!-- ========================================== -->
                <!-- 3. TORCHES & DYNAMIC WARM LIGHTING         -->
                <!-- ========================================== -->

                <!-- Ambient Radial Glow on Stones from Torches -->
                <circle cx="445" cy="460" r="260" fill="url(#torch-glow-left)" />
                <circle cx="905" cy="485" r="260" fill="url(#torch-glow-right)" />

                <!-- Left Wall Sconce Torch -->
                <g id="torch-left">
                    <!-- Iron Wall Bracket -->
                    <path d="M 430,480 L 455,470 L 455,485 L 430,495 Z" fill="#1e293b" />
                    <polygon points="440,460 470,460 460,490 450,490" fill="#0f172a" stroke="#475569" stroke-width="2" />
                    <!-- Animated Flame Shapes -->
                    <g class="animated-flame flame-left" transform="translate(455, 455)">
                        <path d="M 0,0 Q -15,-20 0,-45 Q 15,-20 0,0 Z" fill="#ea580c" opacity="0.75" />
                        <path d="M 0,-4 Q -10,-22 0,-38 Q 10,-22 0,-4 Z" fill="#f59e0b" />
                        <path d="M 0,-8 Q -5,-20 0,-30 Q 5,-20 0,-8 Z" fill="#fef08a" />
                    </g>
                    <!-- Rising Embers -->
                    <circle class="ember ember-1" cx="452" cy="410" r="2" fill="#fbbf24" />
                    <circle class="ember ember-2" cx="458" cy="380" r="1.5" fill="#f97316" />
                </g>

                <!-- Right Wall Sconce Torch -->
                <g id="torch-right">
                    <path d="M 890,505 L 915,495 L 915,510 L 890,520 Z" fill="#1e293b" />
                    <polygon points="900,485 930,485 920,515 910,515" fill="#0f172a" stroke="#475569" stroke-width="2" />
                    <g class="animated-flame flame-right" transform="translate(915, 480)">
                        <path d="M 0,0 Q -15,-20 0,-45 Q 15,-20 0,0 Z" fill="#ea580c" opacity="0.75" />
                        <path d="M 0,-4 Q -10,-22 0,-38 Q 10,-22 0,-4 Z" fill="#f59e0b" />
                        <path d="M 0,-8 Q -5,-20 0,-30 Q 5,-20 0,-8 Z" fill="#fef08a" />
                    </g>
                    <circle class="ember ember-2" cx="912" cy="435" r="2" fill="#fbbf24" />
                    <circle class="ember ember-3" cx="919" cy="405" r="1.5" fill="#f97316" />
                </g>

                <!-- ========================================== -->
                <!-- 4. STONE WARRIOR STATUE (RIGHT ALCOVE)    -->
                <!-- ========================================== -->
                <g id="stone-statue" transform="translate(1420, 160)">
                    <!-- Pedestal Plinth -->
                    <polygon points="40,480 180,480 200,530 20,530" fill="#0b111c" stroke="#1e293b" />
                    <rect x="30" y="525" width="160" height="25" fill="#080c14" />
                    <!-- Statue Cloak & Body -->
                    <path d="M 75,170 Q 110,130 145,170 L 165,470 L 55,470 Z" fill="#121a28" stroke="#1f2c42" stroke-width="2" />
                    <!-- Helm & Visor -->
                    <polygon points="95,140 125,140 128,175 110,185 92,175" fill="#1a2538" />
                    <!-- Downward Sword Held in Both Hands -->
                    <rect x="108" y="220" width="5" height="230" fill="#cbd5e1" />
                    <!-- Sword Crossguard -->
                    <rect x="94" y="220" width="33" height="7" rx="2" fill="#475569" />
                    <circle cx="110" cy="214" r="5" fill="#334155" />
                    <!-- Hands on Pommel -->
                    <circle cx="106" cy="223" r="7" fill="#2d3b52" />
                    <circle cx="115" cy="223" r="7" fill="#2d3b52" />
                </g>

                <!-- ========================================== -->
                <!-- 5. FOREGROUND COBBLESTONE GROUND           -->
                <!-- ========================================== -->
                <g id="cobblestone-floor">
                    <!-- Ground Base Plane with Perspective Gradient -->
                    <polygon points="0,680 1920,680 1920,1080 0,1080" fill="#090d15" />

    <!-- 10. CLIENT SCRIPT (AUDIO + NAVIGATION)     -->
    <!-- ========================================== -->
    <script>
        // --- Web Audio API Procedural Synthesizer (Zero MP3 Dependencies) ---
        class RetroAudio {
            constructor() {
                this.ctx = null;
                this.enabled = true;
            }

            init() {
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    if (AudioCtx) this.ctx = new AudioCtx();
                }
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            playHover() {
                if (!this.enabled) return;
                this.init();
                if (!this.ctx) return;

                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(620, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(880, this.ctx.currentTime + 0.05);

                gain.gain.setValueAtTime(0.08, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.06);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.06);
            }

            playSelect() {
                if (!this.enabled) return;
                this.init();
                if (!this.ctx) return;

                // Rich brass chord chime
                [220, 440, 660].forEach((freq, idx) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);

                    gain.gain.setValueAtTime(0.12 / (idx + 1), this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + 0.45);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.45);
                });
            }

            toggle() {
                this.enabled = !this.enabled;
                return this.enabled;
            }
        }

        const sound = new RetroAudio();
        const audioBtn = document.getElementById('audioToggle');
        const audioIcon = document.getElementById('audioIcon');
        const audioText = document.getElementById('audioText');

        audioBtn.addEventListener('click', () => {
            const active = sound.toggle();
            audioIcon.textContent = active ? '🔊' : '🔇';
            audioText.textContent = active ? 'AUDIO: ACTIVE' : 'AUDIO: MUTED';
        });

        // --- Keyboard & Mouse Navigation ---
        const buttons = Array.from(document.querySelectorAll('.menu-btn'));
        let currentIdx = 0;

        function setActiveButton(index, playSfx = true) {
            if (index < 0) index = buttons.length - 1;
            if (index >= buttons.length) index = 0;
            currentIdx = index;

            buttons.forEach((btn, idx) => {
                if (idx === currentIdx) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });

            if (playSfx) sound.playHover();
        }

        buttons.forEach((btn, idx) => {
            btn.addEventListener('mouseenter', () => {
                setActiveButton(idx, true);
            });

            btn.addEventListener('click', () => {
                executeAction(btn.getAttribute('data-action'));
            });
        });

        window.addEventListener('keydown', (e) => {
            sound.init(); // Auto-unlock audio on user interaction
            if (document.getElementById('modalWindow').classList.contains('open')) {
                if (e.key === 'Escape') closeModal();
                return;
            }

            if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') {
                e.preventDefault();
                setActiveButton(currentIdx - 1, true);
            } else if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') {
                e.preventDefault();
                setActiveButton(currentIdx + 1, true);
            } else if (e.key === 'Enter' || e.key === ' ') {
                e.preventDefault();
                const activeBtn = buttons[currentIdx];
                if (activeBtn) executeAction(activeBtn.getAttribute('data-action'));
            }
        });

        // --- Menu Actions & Modals ---
        const modal = document.getElementById('modalWindow');
        const modalTitle = document.getElementById('modalHeaderTitle');
        const modalContent = document.getElementById('modalContent');
        const modalClose = document.getElementById('modalCloseBtn');

        function openModal(title, html) {
            modalTitle.textContent = title;
            modalContent.innerHTML = html;
            modal.classList.add('open');
            sound.playSelect();
        }

        function closeModal() {
            modal.classList.remove('open');
            sound.playHover();
        }

        modalClose.addEventListener('click', closeModal);
        modal.addEventListener('click', (e) => {
            if (e.target === modal) closeModal();
        });

        function executeAction(action) {
            sound.playSelect();

            switch (action) {
                case 'new-operation':
                case 'continue-operation':
                case 'mission-archive':
                    openModal('TACTICAL OPERATIONS CATALOG', `

                                <div style="color: #94a3b8; font-size: 13px;">Missing Signer Verification in Anchor SVM Program</div>
                            </div>
                            <span class="mission-badge badge-sol">SVM (SOL)</span>
                        </div>

                        <div class="mission-card" onclick="location.href='battle.html'">
                            <div>
                                <div style="font-weight: 700; color: #f8fafc; font-size: 16px;">OPERATION 03: THE PHANTOM BRIDGE</div>
                                <div style="color: #94a3b8; font-size: 13px;">Cross-Chain Relayer Signature Forgery & Replay</div>
                            </div>
                            <span class="mission-badge badge-bridge">EVM + SOL</span>
                        </div>

                        <a href="battle.html" class="btn-launch">ENTER BATTLE ARENA (LOCAL SANDBOX)</a>
                    `);
                    break;

                case 'research-lab':
                    openModal('RESEARCH LAB & SANDBOX STATUS', `
                        <p style="color: #cbd5e1; line-height: 1.6; margin-bottom: 12px;">
                            <strong>Dual-Chain Offline Runtime:</strong>
                        </p>
                        <ul style="color: #94a3b8; margin-left: 20px; line-height: 1.8; font-size: 14px;">
                            <li><strong style="color:#60a5fa">Foundry Anvil (EVM):</strong> http://127.0.0.1:8545 (10 Funded Accounts, 1s block time)</li>
                            <li><strong style="color:#c084fc">Solana Test Validator (SVM):</strong> http://127.0.0.1:8899 (Localnet cluster)</li>
                            <li><strong style="color:#f59e0b">CLI Supervisor:</strong> Managed via <code>./run.sh status</code></li>
                        </ul>
                    `);
                    break;

                case 'personnel-records':
                    openModal('PERSONNEL SQUAD ROSTER', `
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                            <div style="background: rgba(15,23,42,0.8); border: 1px solid #b45309; padding: 14px; border-radius: 6px;">
                                <h3 style="color: #f59e0b; font-family: 'Cinzel', serif; font-size: 16px;">COMMANDO SQUAD 💥</h3>
                                <p style="color: #94a3b8; font-size: 13px; margin-top: 6px;">Heavy economic warfare, flash loans, oracle manipulation, direct high-impact treasury draining.</p>
                            </div>
                            <div style="background: rgba(15,23,42,0.8); border: 1px solid #3b82f6; padding: 14px; border-radius: 6px;">
                                <h3 style="color: #60a5fa; font-family: 'Cinzel', serif; font-size: 16px;">NINJA SQUAD 🥷</h3>
                                <p style="color: #94a3b8; font-size: 13px; margin-top: 6px;">Stealth precision exploits, reentrancy loops, signer bypasses, storage collision, CPI hijacking.</p>
                            </div>
                        </div>
                    `);
                    break;

                case 'settings':
                    openModal('TACTICAL SETTINGS', `
                        <div style="color: #cbd5e1; font-size: 14px; line-height: 2;">
                            <div>• <strong>Render Quality:</strong> Vector SVG (Native 4K Crisp)</div>

                case 'credits':
                    openModal('W3RS ARCHITECTS', `
