[package]
name = "w3rs"
version = "0.0.1-dev"
edition = "2021"
description = "w3rs: Gamified Multi-Chain Web3 Security & Research Lab (In Development)"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.38", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
colored = "2.1"
anyhow = "1.0"
